<script>
    document.getElementById('year').textContent = new Date().getFullYear();
    
    function toggleSideMenu() {
      const menu = document.getElementById('side-menu');
      const overlay = document.getElementById('side-menu-overlay');
      const isOpen = !menu.classList.contains('-translate-x-full');
      if (isOpen) {
        menu.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0', 'pointer-events-none');
      } else {
        menu.classList.remove('-translate-x-full');
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      }
    }

    const GITHUB_USERNAME = "ARXELECTRIC";
    const REPO_NAME = "Main-Site";
    const FOLDER_PATH = "images";
    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FOLDER_PATH}`;

    let sortingDotInterval = null;
    let mobileObserver = null; // Global observer variable

    function startSortingAnimation() {
      const banner = document.getElementById('sorting-banner');
      const textElem = document.getElementById('sorting-text');
      banner.classList.remove('-translate-y-full');
      banner.classList.add('translate-y-0');
      let dotCount = 0;
      sortingDotInterval = setInterval(() => {
        dotCount = (dotCount + 1) % 4;
        textElem.textContent = `SORTING${'.'.repeat(dotCount)}`;
      }, 300);
    }

    function stopSortingAnimation() {
      const banner = document.getElementById('sorting-banner');
      banner.classList.remove('translate-y-0');
      banner.classList.add('-translate-y-full');
      if (sortingDotInterval) clearInterval(sortingDotInterval);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function checkImageLoads(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    // Initialize the observer ONCE before images start loading
    function initMobileScrollColorizer() {
      const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 768);
      if (!isMobile) return;
      
      mobileObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) entry.target.classList.add('mobile-active');
          else entry.target.classList.remove('mobile-active');
        });
      }, { rootMargin: '-20% 0px -20% 0px', threshold: 0.35 });
    }

    function revealGalleryContent() {
      gsap.from(".hero-anim", { y: -20, opacity: 0, duration: 0.6, stagger: 0.1, ease: "power2.out" });
      gsap.from(".gallery-card", { y: -40, opacity: 0, duration: 0.7, stagger: { each: 0.08, from: "start", grid: "auto", axis: "y" }, ease: "power3.out" });
    }

    function startIntroSequence() {
      const introScreen = document.getElementById('intro-screen');
      if (sessionStorage.getItem('arx_visited')) {
        introScreen.style.display = 'none';
        revealGalleryContent();
        return;
      }
      sessionStorage.setItem('arx_visited', 'true');
      const tl = gsap.timeline({
        onComplete: () => {
          gsap.to(introScreen, { yPercent: -100, duration: 0.8, ease: "power4.inOut", onComplete: () => { introScreen.style.display = 'none'; revealGalleryContent(); } });
        }
      });
      tl.to("#intro-title", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" })
        .to("#loader-bar", { width: "100%", duration: 1.4, ease: "power1.inOut", onUpdate: function() { document.getElementById('loader-text').textContent = `[${Math.round(this.progress() * 100)}%] CORE_LOAD_SEQUENCE`; } })
        .to("#intro-title", { textShadow: "0 0 20px rgba(6,182,212,0.8)", duration: 0.2 });
    }

    async function fetchImages() {
      const statusReadout = document.getElementById('status-readout');
      const galleryGrid = document.getElementById('gallery-grid');
      
      startSortingAnimation();
      initMobileScrollColorizer(); // Boot up the tracker immediately
      
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Folder not found.");
        const files = await response.json();
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
        let imageFiles = files.filter(file => imageExtensions.includes(file.name.substring(file.name.lastIndexOf('.')).toLowerCase()));

        if (imageFiles.length === 0) {
          stopSortingAnimation();
          statusReadout.textContent = "[NO_IMAGES_DETECTED]";
          return;
        }

        imageFiles = shuffleArray(imageFiles);
        galleryGrid.innerHTML = ""; 
        let loadedCount = 0;

        for (const file of imageFiles) {
          const imageUrl = `./${FOLDER_PATH}/${file.name}`;
          if (await checkImageLoads(imageUrl)) {
            loadedCount++;
            const card = document.createElement('div');
            card.className = "gallery-card card-frame relative group bg-slate-900/40 border border-slate-800/80 overflow-hidden rounded-sm cursor-pointer break-inside-avoid mb-8";
            card.innerHTML = `<div class="relative w-full h-auto overflow-hidden"><img src="${imageUrl}" loading="lazy" class="w-full h-auto block filter grayscale group-hover:grayscale-0 group-hover:scale-105 group-hover:brightness-110"/><div class="absolute inset-0 bg-transparent z-20 pointer-events-auto"></div></div>`;
            galleryGrid.appendChild(card);
            
            // Watch this specific card the second it hits the page
            if (mobileObserver) {
              mobileObserver.observe(card);
            }
          }
        }
        statusReadout.textContent = `[ONLINE // ${loadedCount}_UNITS]`;
      } catch (error) {
        statusReadout.textContent = "[FETCH_FAILED]";
      } finally {
        stopSortingAnimation();
      }
    }

    startIntroSequence();
    fetchImages();
  </script>
