<!DOCTYPE html>
<html lang="en" class="bg-[#08080c] text-slate-200 antialiased selection:bg-cyan-500 selection:text-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARX-UK // SYSTEM_GALLERY</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body { font-family: 'Space Grotesk', sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
    
    /* Sci-Fi Grid Background */
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    /* Subtle Outer Vignette */
    .vignette {
      background: radial-gradient(circle, transparent 60%, rgba(8, 8, 12, 0.9) 100%);
    }

    /* Target Reticle Hover Effect */
    .card-frame::before, .card-frame::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(6, 182, 212, 0.85);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 30;
    }
    .card-frame::before { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
    .card-frame::after { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }
    .card-frame:hover::before, .card-frame:hover::after { opacity: 1; transform: scale(1.25); }

    /* Disable Image Dragging & Text Selection */
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-grid min-h-screen relative overflow-x-hidden" oncontextmenu="return false;">

  <!-- FIRST-TIME INTRO OVERLAY -->
  <div id="intro-screen" class="fixed inset-0 z-[100] bg-[#08080c] flex flex-col items-center justify-center border-b-2 border-cyan-500/50">
    <div class="mono text-center space-y-4 px-4">
      <div class="flex items-center justify-center gap-2">
        <span class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></span>
        <span class="text-cyan-400 text-xs font-semibold tracking-widest uppercase">// INITIALIZING MATRIX</span>
      </div>
      <h1 id="intro-title" class="text-4xl md:text-6xl font-extrabold tracking-widest text-slate-100 opacity-0 transform translate-y-4">
        ARX-UK
      </h1>
      <!-- Progress Bar -->
      <div class="w-48 md:w-64 h-1 bg-slate-800 rounded-full mx-auto overflow-hidden relative">
        <div id="loader-bar" class="absolute top-0 left-0 bottom-0 w-0 bg-gradient-to-r from-cyan-400 to-indigo-500"></div>
      </div>
      <div id="loader-text" class="text-[10px] text-slate-500 tracking-mono">[0%] CORE_LOAD_SEQUENCE</div>
    </div>
  </div>

  <!-- Vignette Overlay -->
  <div class="fixed inset-0 vignette pointer-events-none z-10"></div>

  <!-- Header / HUD Navigation -->
  <header class="fixed top-0 left-0 w-full z-50 border-b border-slate-800/60 bg-[#08080c]/80 backdrop-blur-md px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></span>
      <h1 class="mono text-xs tracking-widest uppercase font-semibold text-slate-300">
        ARX-UK <span class="text-slate-600">//</span> GALLERY
      </h1>
    </div>
    <div id="status-readout" class="mono text-xs text-cyan-400">
      [SCANNING_DIRECTORY...]
    </div>
  </header>

  <!-- Hero Section -->
  <section class="pt-32 pb-10 px-6 max-w-7xl mx-auto">
    <div class="hero-anim mono text-cyan-400 text-xs mb-2 tracking-wider">// VISUAL MATRIX</div>
    <h2 class="hero-anim text-4xl md:text-6xl font-bold tracking-tight">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">ARX-UK</span>
    </h2>
  </section>

  <!-- Main Gallery Grid (Masonry Columns for Full Uncropped Aspect Ratios) -->
  <main class="px-6 pb-24 max-w-7xl mx-auto">
    <div id="gallery-grid" class="columns-1 md:columns-2 lg:columns-3 gap-8 space-y-8">
      <!-- Images populate automatically here -->
    </div>
  </main>

  <script>
    // =========================================================
    // CONFIGURATION
    // =========================================================
    const GITHUB_USERNAME = "ARXELECTRIC";
    const REPO_NAME = "Main-Site"; // Set to Main-Site or arx-uk depending on your repo name
    const FOLDER_PATH = "images";

    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FOLDER_PATH}`;

    // Array Randomizer (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Run First-Time Intro Animation
    function runIntroAnimation(onCompleteCallback) {
      const introScreen = document.getElementById('intro-screen');
      const hasVisited = sessionStorage.getItem('arx_visited');

      // Skip animation if already visited in this session
      if (hasVisited) {
        introScreen.style.display = 'none';
        onCompleteCallback();
        return;
      }

      sessionStorage.setItem('arx_visited', 'true');

      const tl = gsap.timeline({
        onComplete: () => {
          gsap.to(introScreen, {
            yPercent: -100,
            duration: 0.8,
            ease: "power4.inOut",
            onComplete: () => {
              introScreen.style.display = 'none';
              onCompleteCallback();
            }
          });
        }
      });

      // Animate Loader
      tl.to("#intro-title", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" })
        .to("#loader-bar", {
          width: "100%",
          duration: 1.2,
          ease: "power1.inOut",
          onUpdate: function() {
            const prog = Math.round(this.progress() * 100);
            document.getElementById('loader-text').textContent = `[${prog}%] CORE_LOAD_SEQUENCE`;
          }
        })
        .to("#intro-title", { textShadow: "0 0 20px rgba(6,182,212,0.8)", duration: 0.3 });
    }

    async function fetchImages() {
      const statusReadout = document.getElementById('status-readout');
      const galleryGrid = document.getElementById('gallery-grid');

      try {
        const response = await fetch(API_URL);
        
        if (!response.ok) {
          throw new Error("Folder not found or API limits reached.");
        }

        const files = await response.json();
        
        // Filter web-compatible formats
        const imageExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
        let imageFiles = files.filter(file => {
          const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
          return imageExtensions.includes(ext);
        });

        if (imageFiles.length === 0) {
          statusReadout.textContent = "[NO_IMAGES_DETECTED]";
          galleryGrid.innerHTML = `
            <div class="col-span-full text-center py-12 mono text-slate-500 text-sm">
              // NO SUPPORTED IMAGES FOUND IN THE '/images' FOLDER YET.
            </div>
          `;
          return;
        }

        // RANDOMIZE THE IMAGE ORDER
        imageFiles = shuffleArray(imageFiles);

        statusReadout.textContent = `[ONLINE // ${imageFiles.length}_UNITS]`;
        galleryGrid.innerHTML = ""; 

        // Render cards with randomized order
        imageFiles.forEach((file) => {
          const imageUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${FOLDER_PATH}/${file.name}`;

          const card = document.createElement('div');
          card.className = "gallery-card card-frame relative group bg-slate-900/40 border border-slate-800/80 overflow-hidden rounded-sm cursor-pointer break-inside-avoid mb-8";

          card.innerHTML = `
            <div class="relative w-full h-auto overflow-hidden">
              <img 
                src="${imageUrl}" 
                alt="${file.name}" 
                loading="lazy"
                class="w-full h-auto block transition-transform duration-700 ease-out group-hover:scale-105 group-hover:brightness-110 filter grayscale group-hover:grayscale-0"
              />
              <!-- Shield Layer (Prevents Dragging / Direct Save) -->
              <div class="absolute inset-0 bg-transparent z-20 pointer-events-auto"></div>
            </div>
          `;

          galleryGrid.appendChild(card);
        });

        // Intro sequence controller
        runIntroAnimation(() => {
          gsap.from(".hero-anim", {
            y: 20,
            opacity: 0,
            duration: 0.6,
            stagger: 0.1,
            ease: "power2.out"
          });

          gsap.from(".gallery-card", {
            y: 40,
            opacity: 0,
            duration: 0.7,
            stagger: 0.1,
            ease: "power3.out"
          });
        });

      } catch (error) {
        console.error("Gallery Error:", error);
        statusReadout.textContent = "[FETCH_FAILED]";
        galleryGrid.innerHTML = `
          <div class="col-span-full text-center py-12 mono text-slate-500 text-sm">
            // ERROR: COULD NOT LOAD IMAGES FROM REPOSITORY.<br/>
            PLEASE VERIFY YOUR REPO_NAME IN INDEX.HTML MATCHES GITHUB.
          </div>
        `;
        document.getElementById('intro-screen').style.display = 'none';
      }
    }

    // Initialize
    fetchImages();
  </script>
</body>
</html>
